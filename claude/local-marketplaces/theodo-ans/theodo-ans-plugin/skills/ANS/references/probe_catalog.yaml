# - exigences[]     : liste des N° scénario du référentiel ANS couverts
# - n_scenarios     : nombre d'exigences couvertes (info)
# - section         : section ANS du référentiel
# - epic            : nom de l'EPIC officiel (vide pour les groupes 'section')
# - profiles[]      : profils DMN concernés (extraits des entrées du groupe)
# - preuves_clés[]  : 1-3 preuves représentatives extraites des Preuve 1/2/3
# - tags[]          : facette filtrage UI
# - default_enabled : (optionnel, défaut true) — décoché par défaut si false
#
# Pour /ans-probe, le mapping est :
# entrée cochée → l'agent lit la liste exigences[] et, pour chaque scénario,
# génère un spec Playwright qui capture les preuves attendues (depuis le JSON
# officiel cols 14/16/18).

